"MyTicket":(function(){
class Component extends DCLogic {
renderVals() {
var cells = [];
var seed = 7;
function finder(r, c) {
var boxes = [[0, 0], [0, 14], [14, 0]];
for (var i = 0; i < boxes.length; i++) {
var y = r - boxes[i][0];
var x = c - boxes[i][1];
if (y >= 0 && y < 7 && x >= 0 && x < 7) {
var edge = y === 0 || y === 6 || x === 0 || x === 6;
var core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
return edge || core ? 1 : 0;
}
if (y >= -1 && y < 8 && x >= -1 && x < 8) return 0;
}
return -1;
}
for (var r = 0; r < 21; r++) {
for (var c = 0; c < 21; c++) {
var f = finder(r, c);
seed = (seed * 73 + 41) % 997;
var on = f === -1 ? seed % 2 === 0 : f === 1;
cells.push({ bg: on ? '#0A1A10' : 'transparent' });
}
}
return { cells: cells };
}
}
return Component;})(),

(function(){
var host=document.getElementById('screen');
var inst={},current=null;
function look(scope,path){
  path=path.trim();
  if(path==='true')return true;if(path==='false')return false;
  var v=scope,parts=path.split('.');
  for(var i=0;i<parts.length;i++){if(v==null)return undefined;v=v[parts[i]];}
  return v;
}
var WHOLE=/^\s*\{\{([^}]+)\}\}\s*$/,HOLE=/\{\{([^}]+)\}\}/g;
function fill(str,scope){return str.replace(HOLE,function(_,p){var v=look(scope,p);return v==null?'':v;});}
function build(node,scope,out){
  if(node.nodeType===3){out.appendChild(document.createTextNode(fill(node.nodeValue,scope)));return;}
  if(node.nodeType!==1)return;
  var tag=node.tagName.toLowerCase(),i;
  if(tag==='sc-for'){
    var list=look(scope,node.getAttribute('list').replace(/[{}]/g,''))||[],as=node.getAttribute('as');
    list.forEach(function(item,idx){
      var s=Object.create(scope);s[as]=item;s.$index=idx;
      for(var j=0;j<node.childNodes.length;j++)build(node.childNodes[j],s,out);
    });
    return;
  }
  if(tag==='sc-if'){
    if(look(scope,node.getAttribute('value').replace(/[{}]/g,'')))
      for(i=0;i<node.childNodes.length;i++)build(node.childNodes[i],scope,out);
    return;
  }
  var el=node.cloneNode(false);
  for(i=0;i<node.attributes.length;i++){
    var a=node.attributes[i],m=a.value.match(WHOLE);
    if(a.name==='onclick'&&m){el.removeAttribute('onclick');var fn=look(scope,m[1]);if(typeof fn==='function')el.addEventListener('click',fn);}
    else if(a.value==='__LOGO__')el.setAttribute(a.name,LOGO);
    else if(a.value.indexOf('{{')!==-1)el.setAttribute(a.name,fill(a.value,scope));
  }
  for(i=0;i<node.childNodes.length;i++)build(node.childNodes[i],scope,el);
  out.appendChild(el);
}
function render(name){
  var tpl=document.getElementById('tpl-'+name),c=inst[name];
  var keep={};host.querySelectorAll('input[id],textarea[id],select[id]').forEach(function(e){keep[e.id]=e.value;});
  var frag=document.createDocumentFragment(),nodes=tpl.content.childNodes;
  var vals=c.renderVals();
  for(var i=0;i<nodes.length;i++)build(nodes[i],vals,frag);
  host.innerHTML='';host.appendChild(frag);
  Object.keys(keep).forEach(function(id){var e=document.getElementById(id);if(e)e.value=keep[id];});
  document.title=tpl.getAttribute('data-title')+' · نادي الوحدات';
}
function show(name,push){
  if(!LOGIC[name])name='Main';
  if(!inst[name]){inst[name]=new LOGIC[name]();inst[name]._update=function(){if(current===name){var y=host.scrollTop;render(name);host.scrollTop=y;}};}
  current=name;render(name);host.scrollTop=0;
  if(push)history.pushState({s:name},'','#'+name);
}
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
  var h=a.getAttribute('href'),m=h.match(/^\/?([A-Za-z0-9_]+)\.dc\.html$/);
  if(m){e.preventDefault();show(m[1],true);}
  else if(h==='#'){e.preventDefault();}
});
window.addEventListener('popstate',function(){show((location.hash||'#Main').slice(1),false);});
show((location.hash||'#Main').slice(1),false);
})();

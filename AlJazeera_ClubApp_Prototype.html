#phone{width:390px;height:100%;max-height:844px;overflow:hidden;background:#F7F2E9;position:relative}
#screen{width:390px;height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}

#screen img{object-fit:contain}
#screen nav[aria-label="التنقل الرئيسي"] span{white-space:nowrap}
#screen input,#screen textarea,#screen select{min-width:0;width:100%;box-sizing:border-box}
#screen>div{min-height:100%;height:auto!important}
#screen nav[aria-label="التنقل الرئيسي"]{position:sticky;bottom:0;z-index:5}

#phone{border-radius:36px;box-shadow:0 0 0 10px #141112,0 0 0 12px #45211F,0 30px 80px rgba(0,0,0,.6);max-height:min(844px,calc(100% - 48px))}

}
}

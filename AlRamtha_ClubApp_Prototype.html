<style>
html,body{height:100%;margin:0}
body{background:#060814;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}

button,a{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #8EA4FF;outline-offset:2px}
#phone{width:390px;height:100%;max-height:844px;overflow:hidden;background:#F7F2E9;position:relative}
#screen{width:390px;height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
#screen img{object-fit:contain}
#screen nav[aria-label="التنقل الرئيسي"] span{white-space:nowrap}
#screen input,#screen textarea,#screen select{min-width:0;width:100%;box-sizing:border-box}
#screen>div{min-height:100%;height:auto!important}
#screen nav[aria-label="التنقل الرئيسي"]{position:sticky;bottom:0;z-index:5}
@media (min-width:500px){
#phone{border-radius:36px;box-shadow:0 0 0 10px #0C1024,0 0 0 12px #1F2B57,0 30px 80px rgba(0,0,0,.6);max-height:min(844px,calc(100% - 48px))}
}

<template id="tpl-Article" data-title="تفاصيل الخبر">

</header>

<p style="margin: 0; font-size: 15px; line-height: 1.8">[نص الخبر: تصريحات المدرب، جاهزية اللاعبين، وتفاصيل الحصة التدريبية.]</p>
<p style="margin: 0; font-size: 15px; line-height: 1.8">ودعا النادي جماهيره إلى الحضور المبكر ومساندة الفريق من المدرجات.</p>

<a href="Tickets.dc.html" style="min-height: 52px; border-radius: 16px; background: #2443C0; color: #FFFFFF; text-decoration: none; font-family: 'Readex Pro', Tahoma, sans-serif; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">احجز تذكرتك للمباراة</a>

var edge = y === 0 || y === 6 || x === 0 || x === 6;
var core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
return edge || core ? 1 : 0;
}
if (y >= -1 && y < 8 && x >= -1 && x < 8) return 0;
}
return -1;
}
for (var r = 0; r < 21; r++) {
for (var c = 0; c < 21; c++) {
var f = finder(r, c);
seed = (seed * 73 + 41) % 997;
var on = f === -1 ? seed % 2 === 0 : f === 1;
cells.push({ bg: on ? '#0C1024' : 'transparent' });
}
}
return { cells: cells };
}
}

(function(){
var host=document.getElementById('screen');
var inst={},current=null;
function look(scope,path){
  path=path.trim();
  if(path==='true')return true;if(path==='false')return false;
  var v=scope,parts=path.split('.');
  for(var i=0;i<parts.length;i++){if(v==null)return undefined;v=v[parts[i]];}
  return v;
}
var WHOLE=/^\s*\{\{([^}]+)\}\}\s*$/,HOLE=/\{\{([^}]+)\}\}/g;
function fill(str,scope){return str.replace(HOLE,function(_,p){var v=look(scope,p);return v==null?'':v;});}
function build(node,scope,out){
  if(node.nodeType===3){out.appendChild(document.createTextNode(fill(node.nodeValue,scope)));return;}
  if(node.nodeType!==1)return;
  var tag=node.tagName.toLowerCase(),i;
  if(tag==='sc-for'){
    var list=look(scope,node.getAttribute('list').replace(/[{}]/g,''))||[],as=node.getAttribute('as');
    list.forEach(function(item,idx){
      var s=Object.create(scope);s[as]=item;s.$index=idx;
      for(var j=0;j<node.childNodes.length;j++)build(node.childNodes[j],s,out);
    });
    return;
  }
  if(tag==='sc-if'){
    if(look(scope,node.getAttribute('value').replace(/[{}]/g,'')))
      for(i=0;i<node.childNodes.length;i++)build(node.childNodes[i],scope,out);
    return;
  }
  var el=node.cloneNode(false);
  for(i=0;i<node.attributes.length;i++){
    var a=node.attributes[i],m=a.value.match(WHOLE);
    if(a.name==='onclick'&&m){el.removeAttribute('onclick');var fn=look(scope,m[1]);if(typeof fn==='function')el.addEventListener('click',fn);}
    else if(a.value==='__LOGO__')el.setAttribute(a.name,LOGO);
    else if(a.value.indexOf('{{')!==-1)el.setAttribute(a.name,fill(a.value,scope));
  }
  for(i=0;i<node.childNodes.length;i++)build(node.childNodes[i],scope,el);
  out.appendChild(el);
}
function render(name){
